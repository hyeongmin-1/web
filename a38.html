<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>Font size</title>
        <style>
            h1{
                font-size:5em;
            }
            #a{
                font-size:4em;
            }
            #b{
                font-size:3em;
            }
            #c{
                font-size:2em;
            }
            #d{
                font-size:1em;
            }
            p {
                font-size:5em;
            }
            #e {
                font-size:4em;
            }
            #f {
                font-size:3em;
            }
            #g {
                font-size:2em;
            }
            #h {
                font-size:1em;
            }
            
        </style>
    </head>
    <body>
        <h1>5em의 크기를 가진 제목</h1>
        <h1 id="a">4em의 크기를 가진 제목</h1>
        <h1 id="b">3em의 크기를 가진 제목</h1>
        <h1 id="c">2em의 크기를 가진 제목</h1>
        <h1 id="d"></h1>1em의 크기를 가진 제목</h1>
        <p>5em의 크기를 가진 단락</p>
        <p id="e">4em의 크기를 가진 단락</p>
        <p id="f">3em의 크기를 가진 단락</p>
        <p id="g">2em의 크기를 가진 단락</p>
        <p id="h">1em의 크기를 가진 단락</p>
    </body>
</html>
