<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Date</title>

                color:black;
                line-height:25px;
            }
            input[type="submit"]{
                width:100px;
                height:50px;
                text-align:center;
                margin:10px;
                background-color:gray;
            }
        </style>
    </head>
    <body>
        <form method="get" action="Date" enctype="utf-8">
            <fieldset>

            <label>시작:<input type="date" id="start" name="start"></label>
            <label>종료:<input type="date" id="end name="end></label>
            <input type="submit" value="입력하기">
            </fieldset>
        </form>
    </body>
</html>
