<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>객체 조작 메서드 - 요소 삭제 , 변경</title>

        <script>
            $(function(){
                var result_1 = $("#ch1").prop("checked");
                console.log(result_1);

                var reult_2 = $("#ch2").prop("checked");
                console.log(result_2);

                var result_2 = $("#ch3").prop("checked",true);

                var result_3 = $("se_1").prop("selectedIndex");
                console.log(result_3);
            });

    </head>
    <body>
        <h1><strong>객체 조작 및 생성</strong></h1>

            </p>
            <p>
                <select name="se_1" id="se_1">

        </form>
    </body>
</html>
