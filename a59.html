<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>박스 모델</title>
        <style>
            div{
                width:250px;
                height:300px;
                margin:20px;
                display:inline-block;
                border:2px solid;
                border-radius:70px/40px;
            }
            .bg{
                background:url(img/star.jpg) no-repeat;
                background-size:cover;
            }
             .bg1{
                background:url(img/login.jpg) no-repeat;
                background-size:contain;
            }
             .bg2{
                background:url(img/v.jpg) no-repeat;
                background-size:contain;
            }
             .bg3{
                background:url(img/cal.jpg) no-repeat;
                background-size:cover;
            }
        </style>
    </head>
    <body>
        <div></div>
        <div class="bg"></div>
        <div class="bg1"></div>
        <div class="bg2"></div>
        <div class="bg3"></div>

    </body>
</html>
