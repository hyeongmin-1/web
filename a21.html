<!DOCTYPE html>
<html>
    <head>
        <meta charset = "utf-8">
        <title>웹 폼</title>
        <style>
            ul {
                list-style:none;
                li {
                    margin:10px;
                }
            }
            li label {
                width:120px;
                float:center;
                text-align:right;
                paddig-right:8px;
            }
            input[type="submit"] {
                text-align:center;
                width:100%;
                height:30px;
                margin-top:15px;            
            }            
        </style>
    </head>
    <body>
        <h1>회원가입</h1>
        <form>
        <fieldset>
            <legend>로그인 정보</legend>
            <ul>
                <li>
                    <label for ="user-id">아이디</label>
                    <input type ="text" id="user-id">
                </li>
                <li>
                    <label for ="user-pw1">비밀번호</label>
                    <input type = "password" id="user-pw1">
                </li>
                <li>
                    <label for = "user-pw2">비밀번호 확인</label>
                    <input type = "password" id="user-pw2">
                </li>
            </ul>
        </fieldset>
        <fieldset>
            <legend>개인정보입력</legend>
            <ul>
                <li>
                    <label for ="user-name">이름</label>
                    <input type ="text" id="user-name">
                </li>
                <li>
                    <label fir = "user-email">이메일 주소</label>
                    <input type = "text" id="user-email">                
                </li>
                <li>
                    <label for ="user-phone">연락처</label>
                    <input type = "text" id="user-phone">
                </li>
                <li>
                    <label for = "user-home">블로그/홈페이지</label>
                    <input type = "text" id="user-home">
                </li>
            </ul>
        </fieldset>
        <input type ="submit" value = "가입하기">
    </form>
    </body>
</html>
