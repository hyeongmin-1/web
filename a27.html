<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>실습</title>
        <style>
            form fieldset{
                margin:10px 0;
            }
            form legend{
                font-size:18px;
                color:green;
                font-weight:600;
            }
            form label.reg{
                font-size:14px;
                width:120px;
                float:left;
            }
            form label em{
                color:red;
                font-size:15px;
                font-weight:800;
            }
            form ul li {
                list-style:none;
                margin:10px 0;
            }
            form #easys{
                text-align:left;
                font-size:12px;
                color:blue;
            }
            form #button{
                text-align:center;
            }
        </style>
    </head>
    <body>
        <form>
            <fieldset id="login">
                <legend>로그인</legend>                                    
                    <label for="uid">아이디</label>                        
                    <input type="text" id="uid" size="10" autofoucs>
                    <label for="upw">비밀번호</label>
                    <input type="password" id="upw" size="10">
                    <input type="submit" value="로그인">                  
            </fieldset>
            <fieldset id="register">
                <legend>가입하기</legend>
                <ul>
                    <li>
                        <label class="reg" for="userid">아이디<em>*</em></label>
                        <input type="text" id="nid" size="20" autocomplete="on" required>
                    </li>
                    <li>
                        <label class="reg" for="userpw">비밀번호<em>*</em></label>
                        <input type="password" id="npw" size="20" required>
                    </li>
                    <li>
                        <label class="reg" for="userpw1">비밀번호 확인<em>*</em></label>
                        <input type="password" id="userpw1" size="20" required>
                    </li>
                    <li>
                        <label class="reg" for="username">이름<em>*</em></label>
                        <input type="text" id="username" size="20" required>
                    </li>
                    <li>
                        <label class="reg" for="umail">메일 주소<em>*</em></label>
                        <input type="text" id="umail" size="20" required>
                        <select>
                            <option value="1">naver.com</option>
                            <option value="2">nate.com</option>
                            <option value="3">gmail.com</option>
                            <option value="4">daum.net</option>
                        </select>
                    </li>
                    <li>
                        <label class="reg" for="uphone">전화번호</label>
                        <input type="number" id="uphone" size="20">
                    </li>
                </ul>
            </fieldset>
            <fieldset id="easys">
                <legend>이지스 퍼블리싱</legend>
                <textarea name="intro" col="60" row="5">
                    열심히 사는 사람들의 손을 잡아주는 곳 - 이지스 퍼블리싱

                    우리는 책을 내기 전에 다시 한번 물어봅니다.
                    "이 책이 사람들에게 도움이 되는가?"

                    더 쉽게, 더 빠르게 지식을 전달하고 싶습니다.
                    이지스 퍼블리싱의 책과 앱을 만나보세요.
                </textarea>
            </fieldset>
            <fieldset id="button">
                <button type="submit" value="submit">가입하기</button>
                <button type="reset" value="reset">되돌리기</button>
            </fieldset>
        </form>
    </body>
</html>
