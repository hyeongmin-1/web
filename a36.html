<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <style>
            body{
                color:blue;
            }
            h1{
                font-size:50px;
                color:limegreen;
            }
            h2{
                font-size:20px;
                color:brown;
            }
        </style>

    </head>
    <body>
        <h1 style="color:black;">css</h1>
        <h2>웹 문서의 디자인과 내용을 분리합니다</h2>
        <p>웹 표준에 의한 웹문서는 디자인과 내용이 분리되어 있습니다.</p>
        <p>내용은 HTML을 이용해 구성하고, 디자인은 css를 이용해 꾸미는 것입니다.</p>
    </body>
</html>
