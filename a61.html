<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>box-shadow</title>
        <style>
            div{
                width:200px;
                height:100px;
                display:inline-block;
                margin:15px;
                border:2px solid;
                border-radius:20px;
            }
            .box1{
                box-shadow:2px -2px 5px 0px black;
            }
            .box2{
                box-shadow:5px 5px 15px 5px gray;
            }
            .box3{
                box-shadow:-3px -10px 0px 0px green;
            }
            .box4{
                background:url(img/earth.jpg) no-repeat;
                background-size:cover;
                box-shadow:-6px 6px 0px 5px red;
            }
        </style>
    </head>
    <body>
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
    </body>
</html>
