<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>배경 이미지</title>
        <style>
            div{
                width:600px;
                height:600px;
                border:2px double black;
                margin-bottom:20px;                                
            }
            .bg1{
                background:url(img/naver.jpg) no-repeat left top;
                background-size:auto;
            }
            .bg2{
                background:url(img/star.jpg) no-repeat right top;
                background-size:400px 350px;
            }
            .bg3{
                background:url(img/v.jpg) no-repeat center;
                background-size:60% 40%;
            }
            .bg4{
                background:url(img/corona.jpg) no-repeat left top;
                background-size:contain;
            }
            .bg5{
                background:url(img/app2.jpg) no-repeat left top;
                background-size:cover;
            }
            .bg6{
                background:url(img/upload.jpg) no-repeat left top;
                background-size:100% 100%;
            }

        </style>
    </head>
    <body>        
        <div class="bg1"></div>
        <div class="bg2"></div>
        <div class="bg3"></div>
        <div class="bg4"></div>
        <div class="bg5"></div>
        <div class="bg6"></div>
    </body>
</html>
