<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>함수</title>
        <style>
            *{
                margin:0;
                padding:0;                
            }
            #galleryZon{
                text-align: cetner;
            }
            #galleryZone input[type="image"]{
                margin:0 8px;
            }
            button{
                width:200px;
                height:80px;
                color:black;
                float:left;
                background-color:lightblue;
            }
            img{
                margin-left:100px;
                width:800px;
                height:600px;
                text-align:center;
            }            
        </style>
        <script>
            var num = 1;
            function gallery(direct){
                if(direct) {                    
                    if(num == 9) return; 
                    num++;
                }
                else{
                    if(num == 1) return;
                    num--;
                }
                if(direct){
                    if(num == 9) return num = 1;
                }
                else{
                    if(num == 1) return num = 9;
                }            
            
            var imgTag = document.getElementById("photo");
            imgTag.setAttribute("src","img/pic_" + num + ".jpg");
            }
        </script>
    </head>
    <body>
        <div id="galleryZone">
            <p>
                <img src="img/pic_1.jpg" id="photo" alt=""></p>
            <p>
                <button onclick="gallery(0)">이전</button>
                <button onclick="gallery(1)">다음</button>
            </p>
        </div>
    </body>
</html>
