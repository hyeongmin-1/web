<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>display</title>
        <style>
            div{
                margin:20px;
                border:1px solid #ccc;
                border-radius:5px;
            }
            #inline{
                margin:10px;
            }
            #block{
                display: block;
                margin:10px;
            }
        </style>
    </head>
    <body>
        <div id="inline">
            <img src="img/cal.jpg">
            <img src="img/star.jpg">
            <img src="img/earth.jpg">
        </div>
        <div id="block">
            <img src="img/gal.jpg">
            <img src="img/login.jpg">
            <img src="img/corona.jpg">
        </div>
    </body>
</html>
