        <title>함수</title>
        <script>
            var rightId = "korea";
            var rightPw = "1234";

                if(id == rightId){
                if(pw == rightPw){
                    document.write("user" + "님 로그인 성공하셨습니다.");
                }
                else{
                    alert("잘못된 비밀번호입니다.");
                }
                
                }

                    alert("아이디가 존재하지 않습니다.");

            var userId = prompt("아이디를 입력하세요","");

            login(userId, userPw);
