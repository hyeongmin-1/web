<!DOCTYPE html>
<html lang="ko">
    <head>
    <meta charset="utf-8">
    <title>제이쿼리 위치탐색 선택자 even-odd</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script>
        $(function(){
            $("#menu li:even")
            .css({"background-color":"#ff0"});

            $("#menu li:odd")
            .css({"background-color":"#0ff"});
        })
    </script>
    </head>
    <body>
        <h1>탐색 선택자</h1>
        <ul id="menu">
            <li>내용1</li>
            <li>내용2</li>
            <li>내용3</li>
            <li>내용4</li>
        </ul>
    </body>
</html>
