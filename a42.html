<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <style>
            .big-line{
                line-height:2;
            }
            .small-line{
                line-height:0.8;
            }
            .content{
                border:1px solid #ccc;
                width:300px;
                white-space:nowrap;
                overflow: hidden;
                text-overflow:ellipsis;
            }
            .content:hover{
                overflow:visible;
            }
        </style>
    </head>
    <body>
        <h2>귀리(Oat)</h2>
        <p class="content">귀리는 베타글루칸(항암 및 면역증강작용을 가지고 있는
            불소화성 다당류)성분을 포함하고 있다.</p>
        <p class="big-line">따라서 다이어트에 효과적이다.</p>
        <p class="small-line">다만 과섭취시 수분부족으로 탈수할 수 있으니 섭취용량에 주의해야한다.</p>
    </body>
</html>
