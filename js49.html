<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>제이쿼리 탐색 선택자 index()</title>
        <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>    
        <script>
            $(function(){
                var idxNum = $("li").index($("#list3"));
                console.log(idxNum);
            });
        </script>
    </head>
    <body>
        <h1>배열 관련 메서드</h1>
        <ul>
            <li>내용1</li>
            <li>내용2</li>
            <li id="list3">내용3</li>
            <li>내용4</li>
        </ul>
    </body>
</html>
