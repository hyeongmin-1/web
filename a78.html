<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>Table CSS</title>
        <style>
            table,td {
                border:1px solid black;
                border-radius: 10px;
            }
            td{
                height:100px;
                padding:20px;
                                             
            }
            .va1{
                vertical-align: top;
                background:red;
            }
            .va2{
                vertical-align: bottom;
                background:blue;
            }
            .va3{
                vertical-align: middle;
                background:green;
            }
        </style>
    </head>   
    <body>
        <table>
            <caption>Vertical-alignment</caption>
            <tr>
                <td class="va1">alignment</td>
                <td class="va2">alignment</td>
                <td class="va3">alignment</td>
            </tr>
        </table>
    </body>
</html>
