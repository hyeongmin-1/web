<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>location 객체</title>
        <script>
            //현재 문서의 url 주소
            document.write("현재 문서의 주소는" + location.href + "입니다."+"<br>");            
            //현재 문서의 호스트 이름
            document.write("현재 문서의 호스트 이름은" + location.hostname + "입니다."+"<br>");            
            //현재 문서의 파일 경로명
            document.write("현재 문서의 파일 경로명은" + location.pathname + "입니다."+"<br>");           
            //현재 문서 다시 부르기
            location.reload();            
        </script>

    </head>
    <body>        
    </body>
</html>
