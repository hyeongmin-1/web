<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>박스모델</title>
        <style>
            #container{
                width:800px;
                margin:20px auto;
                padding:20px;
            }
            .left-img{
                float:left;
                margin-right:25px;
            }
            p{
                line-height: 30px;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <img src="img/book2.jpg" class="left-img" alt="">
            <h1>바쁜 3,4학년을 위한 영단어책</h1>
            <h2>3,4학년이 꼭 알아야 할 영단어를 한 권에 모았어요!</h2>
            <p>한국 교육과정평가원이 최근 발표한 보고서에 따르면 '영포자'
                는 초등 3학년때 긴 단어를 배우면서 시작된다고 합니다.
                긴 단어를 어려워하는 이유는 한글은 한자로 이루어진 축약단어이지만,
                영어는 단어와 단어를 이어붙여 단어를 만들기때문에 낯설기 때문입니다.
                이렇게 낯설고 어려운 단어, 어떻게 공부해야 할까요?</p>
        </div>
    </body>
</html>
