<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>실습</title>
        <style>
            body {
                background-color:white;
            }
            form fieldset {
                margin-bottom:25px;
            }
            form legend {
                font-size:15px;
                font-weight:600;
            }
            form label.reg {
                font-size:14px;
                width:110px;
                color:green;
                font-weight:bold;
                float:left;
                text-align:right;
                margin-right:10px;
            }
            form ul li {
                list-style:none;
                margin:15px 0;
                font-size:14px;
            }
            button{
                background-color:cornflowerblue;
                font-weight:bold;
                text-align:center;
            }
            form #button{
                text-align:center;
            }
        </style>
    </head>
    <body>
        <form>
            <fieldset id="subject">
                <legend>수강과목</legend>
                <ul>
                    <li>
                        <label class="reg" for ="subj">영어회화(초급)</label>
                        <input type="date" id="date">
                    </li>
                </ul>
            </fieldset>
            <fieldset id="register">
                <legend>신청자</legend>
                <ul>
                    <li>
                        <label class="reg" for="uname">이름</label>
                        <input type="text" id="uname"  autofocus required>
                    </li>
                    <li>
                        <label class="reg" for="uid">학번</label>
                        <input type="text" id="uid" placeholder="하이픈없이 입력" maxlength="8" required>
                    </li>
                    <li>
                        <label class="reg" for="uclass">학과</label>
                        <select id="uclass">
                            <option value="archi">건축공학과</option>
                            <option value="meca">기계공학과</option>
                            <option value="indus">산업공학과</option>
                            <option value="elec">전기공학과</option>
                            <option value="com">컴퓨터공학과</option>
                            <option value="chemi">화학공학과</option>
                        </select>
                    </li>
                </ul>
            </fieldset>
            <fieldset>
                <legend>교재 주문</legend>
                <ul>
                    <li>
                        <label class="reg" for="book">교재</label>
                        <input type="number" id="book" value="1" min="1" max="3">
                    </li>
                    <li>
                        <label class="reg" for="sheet">워크시트</label>
                        <input type="number" id="sheet" value="1" min="1" max="5">
                    </li>
                    <li>
                        <label class="reg" for="group">단체 주문</label>
                        <input type="number" id="group" value="0" min="10" max="100" step="10">
                    </li>
                </ul>
            </fieldset>
            <fieldset id="button">
                <button type="submit" value="submit">신청하기</button>
                <button type="reset" value="reset">되돌리기</buttom>
            </fieldset>
        </form>
    </body>
</html>
