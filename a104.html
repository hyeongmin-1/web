<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>실습</title>
        <style>
            *{
                margin:0;
                padding:0;
                box-sizing:border-box;
            }
            #container{
                width:200px;
                margin:10px auto;
            }
            .card{
                position: relative;
                width:300px;
                height:200px;
                margin:10px 10px;
                border:1px solid black;
                background-color: white;
                
            }
            .word{
                position: absolute;
                float:right;
                width:200px;
                
            }
            footer{
                width:300px;
                height:30px;
                background-color:blue;
                left:30px;
                border:1px solid black;
            }

            @media screen and (min-width:768px){
                #container{
                    width:570px;
                    margin:5px auto;
                }
                .card{
                position: relative;
                width:300px;
                height:200px;
                margin:10px 10px;
                border:1px solid black;
                background-color: white;                
            }
                .word{
                position: absolute;
                float:right;
                width:200px;                

            }
            footer{
                width:300px;
                height:30px;
                background-color:blue;
                left:30px;
                border:1px solid black;
            }
            }
            @media screen and (min-width:768px) and (max-width:1300px){
                #container{
                    width:570px;
                    margin:5px auto;
                }
                .card{
                position: relative;
                width:300px;
                height:200px;
                margin:10px 10px;
                border:1px solid black;
                background-color: white;                
            }
                .word{
                position: absolute;
                float:right;
                width:200px;                

            }
            footer{
                width:300px;
                height:30px;
                background-color:blue;
                left:30px;
                border:1px solid black;
            }
            }
            @media screen and (min-width:1300px) and (max-width:1719px){
                #container{
                    width:1719px;
                    margin:5px auto;
                }
                .card{
                position: relative;
                width:300px;
                height:200px;
                margin:10px 10px;
                border:1px solid black;
                background-color: white;                
            }
                .word{
                position: absolute;
                float:right;
                width:200px;
                                

            }
            footer{
                width:300px;
                height:30px;
                background-color:blue;
                left:30px;
                border:1px solid black;
            }
            }
        </style>
    </head>
    <body>
        <div class="container">            
            <div class="card">
                <h1>사이트제목</h1>
            </div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card">
               <div class="word"></div>
            </div>
        </div>
        <footer>
        </footer>

    </body>
</html>
